<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAZTi & Jesi — La Aventura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <div class="topbar">
      <div class="logo">GAZTi <span>♥</span> JESI</div>
      <div class="hud">
        <span>♥ <b id="lives">3</b></span>
        <span>🃏 <b id="cards">0</b>/3</span>
      </div>
    </div>

    <section class="screen-wrap">
      <canvas id="game" width="960" height="540"></canvas>

      <div id="message" class="message hidden">
        <div class="message-box">
          <div id="message-icon">♥</div>
          <h2 id="message-title">¡Nuevo recuerdo!</h2>
          <p id="message-text"></p>
          <button id="message-button">Continuar</button>
        </div>
      </div>
    </section>

    <div class="controls">
      <span>← → Mover</span>
      <span>ESPACIO / ↑ Saltar</span>
      <span>R Reiniciar</span>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
